<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gearMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="gearBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="innerHole" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Precision Gear Body (10 Teeth) -->
  <path d="
    M 64 22
    L 70 22 L 72 31 L 79 33 L 86 28 L 91 33 L 87 40 L 92 46 L 101 46 L 103 54 L 97 60 L 98 68 L 106 72 L 103 80 L 94 81 L 91 88 L 96 95 L 89 100 L 83 95 L 76 98 L 74 106 L 66 106 L 64 98 L 57 97 L 51 102 L 44 97 L 48 90 L 43 84 L 34 83 L 33 75 L 40 70 L 39 62 L 31 58 L 34 50 L 42 49 L 46 42 L 41 35 L 48 30 L 54 35 L 61 32 Z
  " fill="url(#gearMetal)" stroke="url(#gearBevel)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner Recessed Ring -->
  <circle cx="64" cy="64" r="26" fill="url(#gearBevel)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="22" fill="url(#gearMetal)"/>

  <!-- Center Axle Hole -->
  <circle cx="64" cy="64" r="14" fill="url(#innerHole)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Specular Reflection Highlight -->
  <path d="M 45 45 Q 64 35 83 45 Q 64 40 45 45 Z" fill="#ffffff" opacity="0.65"/>
</svg>
