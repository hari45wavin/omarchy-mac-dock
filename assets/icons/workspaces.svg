<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="cardMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="cardFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background Desktop Card 1 -->
  <rect x="22" y="24" width="60" height="42" rx="6" fill="url(#cardBack)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="22" y="24" width="60" height="10" rx="6" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="28" cy="29" r="2" fill="#ef4444" opacity="0.8"/>
  <circle cx="34" cy="29" r="2" fill="#eab308" opacity="0.8"/>
  <circle cx="40" cy="29" r="2" fill="#22c55e" opacity="0.8"/>

  <!-- Middle Desktop Card 2 -->
  <rect x="46" y="42" width="60" height="42" rx="6" fill="url(#cardMid)" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.6"/>
  <rect x="46" y="42" width="60" height="10" rx="6" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="52" cy="47" r="2" fill="#ef4444" opacity="0.9"/>
  <circle cx="58" cy="47" r="2" fill="#eab308" opacity="0.9"/>
  <circle cx="64" cy="47" r="2" fill="#22c55e" opacity="0.9"/>

  <!-- Foreground Active Desktop Card 3 -->
  <rect x="30" y="60" width="68" height="46" rx="8" fill="url(#cardFront)"/>
  <rect x="30" y="60" width="68" height="12" rx="8" fill="#f1f5f9"/>
  <!-- Traffic light dots -->
  <circle cx="38" cy="66" r="2.5" fill="#ef4444"/>
  <circle cx="45" cy="66" r="2.5" fill="#f59e0b"/>
  <circle cx="52" cy="66" r="2.5" fill="#10b981"/>

  <!-- Content lines on active window -->
  <rect x="38" y="78" width="32" height="4" rx="2" fill="#94a3b8"/>
  <rect x="38" y="86" width="52" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="38" y="94" width="44" height="4" rx="2" fill="#cbd5e1"/>
</svg>
