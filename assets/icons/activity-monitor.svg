<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="neonPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Grid Lines -->
  <line x1="20" y1="44" x2="108" y2="44" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="20" y1="64" x2="108" y2="64" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <line x1="20" y1="84" x2="108" y2="84" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="42" y1="26" x2="42" y2="102" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="64" y1="26" x2="64" y2="102" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="86" y1="26" x2="86" y2="102" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Glowing Glow Under Pulse -->
  <path d="M 20 64 L 40 64 L 47 48 L 54 82 L 62 30 L 70 94 L 77 64 L 88 64 L 94 56 L 100 64 L 108 64" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow)"/>

  <!-- Main Sharp Neon ECG Pulse Wave -->
  <path d="M 20 64 L 40 64 L 47 48 L 54 82 L 62 30 L 70 94 L 77 64 L 88 64 L 94 56 L 100 64 L 108 64" fill="none" stroke="url(#neonPulse)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High-Intensity Pulse Head -->
  <circle cx="62" cy="30" r="3.5" fill="#ffffff"/>
  <circle cx="70" cy="94" r="3.5" fill="#34d399"/>
</svg>
