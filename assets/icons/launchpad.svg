  <!-- Main Fuselage -->
  <path d="M 92 36 C 96 32 94 28 88 32 C 72 44 54 62 48 80 C 58 86 70 82 80 72 C 90 60 92 42 92 36 Z" fill="url(#rocketBody)"/>

  <!-- Rocket Nose Tip -->
