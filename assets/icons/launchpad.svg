  <!-- Cockpit Window -->
  <circle cx="72" cy="52" r="7.5" fill="#475569"/>
  <circle cx="72" cy="52" r="5.5" fill="url(#windowGrad)"/>
  <circle cx="70.5" cy="50.5" r="1.8" fill="#ffffff" opacity="0.8"/>
