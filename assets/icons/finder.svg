<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4aa8ff"/>
      <stop offset="100%" stop-color="#0066dc"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80c6ff"/>
      <stop offset="100%" stop-color="#3b99ff"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b99ff"/>
      <stop offset="100%" stop-color="#0066dc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Face Half -->
  <path d="M 22 28 C 22 24, 64 24, 64 24 L 64 104 C 64 104, 22 104, 22 100 C 22 96, 22 32, 22 28 Z" fill="url(#faceLeft)"/>

  <!-- Right Face Half -->
  <path d="M 64 24 C 64 24, 106 24, 106 28 C 106 32, 106 96, 106 100 C 106 104, 64 104, 64 104 Z" fill="url(#faceRight)"/>

  <!-- Center Dividing Nose Line -->
  <path d="M 64 24 Q 61 48 57 60 Q 53 72 64 74 L 64 104" fill="none" stroke="#003580" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Eye -->
  <circle cx="43" cy="54" r="5" fill="#002b66"/>

  <!-- Right Eye -->
  <circle cx="85" cy="54" r="5" fill="#002b66"/>

  <!-- Classic Finder Smile -->
  <path d="M 38 80 Q 64 102 90 80" fill="none" stroke="#002b66" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Top Glass Sheen -->
